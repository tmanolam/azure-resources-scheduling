name: CI

# Quality gate only: runs the unit tests and Terraform static checks on every
# push and pull request. It performs NO deployment (deployment is by Terraform
# CLI / deploy.sh per REQUIREMENTS §3.2) and needs no cloud credentials, because
# the engine is SDK-free and Terraform is validated with -backend=false.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # The engine itself has no third-party runtime deps for the tests
        # (Azure SDK imports are lazy); only pytest and tzdata are needed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest tzdata

      - name: Run unit tests
        run: python -m pytest -q

  terraform-checks:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra/

      - name: terraform init (no backend) + validate
        working-directory: infra/scheduler
        run: |
          terraform init -backend=false -input=false
          terraform validate
